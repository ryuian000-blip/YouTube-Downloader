name: Build Windows + macOS executables

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg via Chocolatey
        run: choco install ffmpeg-full -y

      - name: Copy ffmpeg/ffprobe next to the project
        shell: pwsh
        run: |
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg -Destination .\ffmpeg.exe
          Copy-Item $ffprobe -Destination .\ffprobe.exe

      - name: Download Deno
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath .
          Remove-Item deno.zip

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-windows
          path: dist/YouTube Downloader.exe

  build-macos:
    # GitHub's macos-latest runners are Apple Silicon (arm64), so this
    # produces an arm64 .app -- the ffmpeg/ffprobe and deno binaries below
    # both match that. Friends on Intel Macs would need Rosetta (usually
    # already installed) or a separate x86_64 runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download static ffmpeg/ffprobe (macOS arm64)
        # NOT `brew install ffmpeg` + copy the binary: Homebrew's ffmpeg is
        # dynamically linked against ~25 of its own dylibs (libavcodec,
        # libx264, libopus, ...) resolved via @rpath into the Homebrew
        # Cellar. Copying just the executable leaves those unresolved --
        # PyInstaller doesn't bundle them either, so the shipped ffmpeg
        # fails on any Mac without that exact Homebrew layout (i.e. every
        # friend's Mac): `dyld: Library not loaded: @rpath/libavdevice.62.dylib`.
        # ffmpeg.martin-riedl.de's static builds have no such dependencies
        # (only Apple system frameworks, present on every Mac) -- verified
        # by hand against this exact release. Scrapes the current release
        # (not nightly) build for macOS arm64 and checksum-verifies it.
        run: |
          set -euo pipefail
          page=$(curl -fsSL -A "Mozilla/5.0" https://ffmpeg.martin-riedl.de/)
          ffmpeg_path=$(echo "$page" | grep -oE 'href="/download/macos/arm64/[0-9]+_[0-9.]+/ffmpeg\.zip"' | sed 's/href="//;s/"//' | sort -t/ -k5 -n | tail -1)
          ffprobe_path=$(echo "$ffmpeg_path" | sed 's/ffmpeg\.zip$/ffprobe.zip/')
          if [ -z "$ffmpeg_path" ]; then
            echo "Could not find a macOS arm64 release build on ffmpeg.martin-riedl.de" >&2
            exit 1
          fi
          base="https://ffmpeg.martin-riedl.de"
          for name in ffmpeg ffprobe; do
            path=$(eval echo "\$${name}_path")
            curl -fsSL -A "Mozilla/5.0" -o "$name.zip" "$base$path"
            curl -fsSL -A "Mozilla/5.0" -o "$name.zip.sha256" "$base$path.sha256"
            expected=$(awk '{print $1}' "$name.zip.sha256")
            actual=$(shasum -a 256 "$name.zip" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "Checksum mismatch for $name.zip" >&2
              exit 1
            fi
            unzip -o -q "$name.zip" -d "${name}_extracted"
            mv "${name}_extracted/$name" "./$name"
            chmod +x "./$name"
            rm -rf "$name.zip" "$name.zip.sha256" "${name}_extracted"
          done

      - name: Download Deno
        run: |
          curl -fsSL -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip
          unzip deno.zip -d .
          rm deno.zip
          chmod +x deno

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Ad-hoc codesign the app bundle
        # No Apple Developer account, so this can't be a real Developer ID
        # signature or notarization -- but an unsigned arm64 .app combined
        # with the quarantine flag macOS adds on download makes Gatekeeper
        # refuse to open it at all ("is damaged and can't be opened", no
        # bypass). Ad-hoc signing (identity "-") satisfies arm64's signing
        # requirement so Gatekeeper falls back to its normal "Apple could
        # not verify..." prompt instead of an unrecoverable "damaged" one
        # (see README's Gatekeeper section for how a friend gets past it).
        run: codesign --force --deep --sign - "dist/YouTube Downloader.app"

      - name: Zip the app bundle
        # actions/upload-artifact treats a directory path as the archive
        # root -- i.e. it uploads Contents/, Contents/MacOS/, etc. loose at
        # the top level, not wrapped in a "YouTube Downloader.app" folder.
        # Downloading and unzipping that gives you the bundle's insides
        # scattered on disk, not a double-clickable .app: Finder has
        # nothing to recognize as an app bundle, so the raw executable
        # inside shows a generic "exec" icon instead of the real one.
        # ditto preserves the bundle (and its code signature) as a single
        # unit the way Apple's own tools expect; zipping it ourselves and
        # uploading the resulting .zip as a single file keeps the
        # "YouTube Downloader.app" folder intact end to end.
        #
        # Also bundles in "How To Open YouTube Downloader.html" (see
        # README's Gatekeeper section) so a friend has clear steps for
        # the one-time unblock the ad-hoc-signed .app needs on first
        # open. Deliberately a plain HTML file, not a script: a .command
        # helper hits the exact same Gatekeeper block as the app itself
        # (it's still an executable macOS has to "verify"), while a
        # document just opens in the browser, no verification involved.
        run: |
          mkdir dist/stage
          mv "dist/YouTube Downloader.app" dist/stage/
          cp "How To Open YouTube Downloader.html" dist/stage/
          ditto -c -k dist/stage "dist/YouTube Downloader-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-macos
          path: dist/YouTube Downloader-macos.zip
