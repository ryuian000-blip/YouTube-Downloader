[pytest]
testpaths = tests
python_files = test_*.py
# Every collected test is headless by design -- no window ever opens, so
# the suite runs the same in CI, over SSH, and on a dev machine.
# tests/smoke_network.py is deliberately NOT named test_*.py: it hits
# YouTube for real and is run by hand (see its docstring).
# QT_QPA_PLATFORM is set in conftest.py rather than here, so it lands
# before PySide6 is imported without needing the pytest-env plugin.
addopts = -q
